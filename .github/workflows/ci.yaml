name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Linux (GCC / C++23)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev pkg-config

      - name: Configure CMake
        run: cmake -S compiler -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build compiler and tests
        run: cmake --build build -j

      - name: Run C++ unit tests and Layer 1 regression suite
        run: ctest --test-dir build --output-on-failure

      - name: Run packed executable end-to-end test
        run: |
          ./build/lang lib/std/start.lang lib/std/build.lang tests/test_pack_exe.lang ./build/test_pack_exe
          set +e
          ./build/test_pack_exe hello
          rc=$?
          set -e
          echo "test_pack_exe exit code: $rc"
          test "$rc" -eq 42
